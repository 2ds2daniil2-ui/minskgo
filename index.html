<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinskGo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .accent { color: #ff5500; }
        
        /* Переключение вкладок */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            color: #888;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active { background-color: #ff5500; border-color: #ff5500; color: white; }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Лента объявлений */
        .event-card {
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
        }
        .event-card h3 { margin: 0 0 8px 0; color: #ff5500; font-size: 18px; }
        .event-card p { margin: 4px 0; color: #ccc; font-size: 14px; }
        
        /* Сетка категорий (Экран создания) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-btn {
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px 10px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .category-btn.selected { border-color: #ff5500; background-color: rgba(255, 85, 0, 0.1); }
        .icon { font-size: 26px; }

        .input-field {
            width: 100%;
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .input-field:focus { border-color: #ff5500; }
        
        .main-btn {
            background-color: #ff5500;
            border: none;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>MINSK<span class="accent">GO</span></h1>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('feed')">🔥 Лента</button>
        <button class="tab-btn" onclick="switchTab('create')">➕ Создать</button>
    </div>

    <!-- ЭКРАН 1: Лента объявлений -->
    <div id="feed-screen" class="screen active">
        <div id="events-container">
            <p style="color: #666;">Загрузка объявлений...</p>
        </div>
    </div>

    <!-- ЭКРАН 2: Создание встречи -->
    <div id="create-screen" class="screen">
        <p style="color: #888; font-size: 14px; margin-bottom: 15px;">Выбери категорию:</p>
        <div class="grid" id="categories-grid">
            <button class="category-btn" onclick="selectCategory(this, 'Бильярд')"><i class="fa-solid fa-circle-dot icon"></i> Бильярд</button>
            <button class="category-btn" onclick="selectCategory(this, 'Бар')"><i class="fa-solid fa-beer-mug-empty icon"></i> Бар</button>
            <button class="category-btn" onclick="selectCategory(this, 'Кино')"><i class="fa-solid fa-film icon"></i> Кино</button>
            <button class="category-btn" onclick="selectCategory(this, 'Спорт')"><i class="fa-solid fa-futbol icon"></i> Спорт</button>
        </div>

        <div style="margin-top: 15px; text-align: left;">
            <p style="color: #888; font-size: 14px; margin-bottom: 5px;">Где и во сколько?</p>
            <input type="text" id="event-details" class="input-field" placeholder="Например: Галерея в 19:00">
        </div>
        
        <button class="main-btn" onclick="submitNewEvent()">Опубликовать встречу 🚀</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        let selectedCategory = "";
        const API_URL = "https://sandbag-lingo-python.ngrok-free.dev"; // Позже заменим на облачный адрес

        // Переключение между вкладками
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            if (tab === 'feed') {
                event.target.classList.add('active');
                document.getElementById('feed-screen').classList.add('active');
                loadEvents();
            } else {
                event.target.classList.add('active');
                document.getElementById('create-screen').classList.add('active');
            }
        }

        function selectCategory(btn, cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCategory = cat;
        }

       // Загрузка ленты с бэкенда
        async function loadEvents() {
            let container = document.getElementById('events-container');
            container.innerHTML = '<p style="color: #666;">Загрузка...</p>';
            try {
                let response = await fetch(`${API_URL}/api/events`, {
                    headers: {
                        "ngrok-skip-browser-warning": "69420" // Обходим защиту ngrok
                    }
                });
                let events = await response.json();
                
                if (events.length === 0) {
                    container.innerHTML = '<p style="color: #666;">Пока нет активных встреч. Создай первую!</p>';
                    return;
                }

                container.innerHTML = '';
                events.forEach(ev => {
                    container.innerHTML += `
                        <div class="event-card">
                            <h3>🎯 ${ev.category}</h3>
                            <p>📍 <b>Где/Когда:</b> ${ev.details}</p>
                            <p>👤 <b>Автор:</b> ${ev.creator_name}</p>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p style="color: #ff5500;">Ошибка соединения с сервером.</p>';
            }
        }

       async function submitNewEvent() {
            try {
                // Шаг 1: Проверяем, срабатывает ли вообще кнопка
                tg.showAlert("Шаг 1: Кнопка нажата!");

                let detailsInput = document.getElementById('event-details');
                if (!detailsInput) {
                    tg.showAlert("Ошибка: не найдено поле ввода текста (event-details)!");
                    return;
                }
                
                let details = detailsInput.value;
                if (!details) {
                    tg.showAlert("Напиши подробности встречи!");
                    return;
                }
                
                // Перестраховка: если ты забыл объявить selectedCategory, код не упадет
                let categoryToUse = typeof selectedCategory !== 'undefined' ? selectedCategory : "Разное";

                let user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Владислав" };
                
                tg.showAlert("Шаг 2: Данные собраны, отправляем POST-запрос...");

                let response = await fetch(`${API_URL}/api/create-event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        creator_id: user.id,
                        creator_name: user.first_name,
                        category: categoryToUse,
                        details: details
                    })
                });

                if (response.ok) {
                    tg.showAlert("Шаг 3: УРА! Сервер принял данные 🚀");
                    detailsInput.value = '';
                    switchTab('feed');
                    loadEvents();
                } else {
                    tg.showAlert("Шаг 3: Сервер ответил ошибкой " + response.status);
                }
            } catch (err) {
                // Выведет точную причину блокировки браузером (например, CORS)
                tg.showAlert("Шаг 3: Ошибка отправки (браузер заблокировал): " + err.message);
            }
        }
        // Загружаем ленту при открытии
        loadEvents();
    </script>
</body>
</html>
