<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinskGo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .accent {
            color: #ff5500;
        }

        p {
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .category-btn {
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 32px;
            color: #ffffff;
            transition: all 0.3s ease; 
        }

        .category-btn:hover {
            border-color: #ff5500;
            transform: translateY(-5px); 
            box-shadow: 4px 9px 0px rgba(255, 85, 0, 0.2); 
        }

            .category-btn:hover .icon {
                color: #ff5500; 
                transform: scale(1.15); 
            }

        .category-btn:active {
            background-color: #ff5500;
            border-color: #ff5500;
            box-shadow: 0px 0px 0px rgba(0,0,0,0);
            transform: translate(4px, 4px);
        }

            .category-btn:active .icon {
                color: #ffffff;
            }
    </style>
</head>
<body>

    <h1>MINSK<span class="accent">GO</span></h1>
    <p>Выбери, чем займемся сегодня</p>

    <div class="grid">
        <button class="category-btn" onclick="selectCategory('Бильярд')">
            <i class="fa-solid fa-circle-dot icon"></i> Бильярд
        </button>
        <button class="category-btn" onclick="selectCategory('Бар')">
            <i class="fa-solid fa-beer-mug-empty icon"></i> Бар
        </button>
        <button class="category-btn" onclick="selectCategory('Кино')">
            <i class="fa-solid fa-film icon"></i> Кино
        </button>
        <button class="category-btn" onclick="selectCategory('Спорт')">
            <i class="fa-solid fa-futbol icon"></i> Спорт
        </button>
        <button class="category-btn" onclick="selectCategory('Игры')">
            <i class="fa-solid fa-gamepad icon"></i> Игры
        </button>
        <button class="category-btn" onclick="selectCategory('Авто')">
            <i class="fa-solid fa-car icon"></i> Авто
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function selectCategory(categoryName) {
        tg.sendData(categoryName);
        }
    </script>
</body>
</html>
