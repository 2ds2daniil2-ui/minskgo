<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinskGo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .accent { color: #ff5500; }
        
        /* Переключение вкладок */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            color: #888;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active { background-color: #ff5500; border-color: #ff5500; color: white; }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Лента объявлений */
        .event-card {
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
        }
        .event-card h3 { margin: 0 0 8px 0; color: #ff5500; font-size: 18px; }
        .event-card p { margin: 4px 0; color: #ccc; font-size: 14px; }
        
        /* Сетка категорий (Экран создания) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-btn {
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px 10px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .category-btn.selected { border-color: #ff5500; background-color: rgba(255, 85, 0, 0.1); }
        .icon { font-size: 26px; }

        .input-field {
            width: 100%;
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .input-field:focus { border-color: #ff5500; }
        
        .main-btn {
            background-color: #ff5500;
            border: none;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>MINSK<span class="accent">GO</span></h1>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('feed')">🔥 Лента</button>
        <button class="tab-btn" onclick="switchTab('create')">➕ Создать</button>
    </div>

    <!-- ЭКРАН 1: Лента объявлений -->
    <div id="feed-screen" class="screen active">
        <div id="events-container">
            <p style="color: #666;">Загрузка объявлений...</p>
        </div>
    </div>

    <!-- ЭКРАН 2: Создание встречи -->
    <div id="create-screen" class="screen">
        <p style="color: #888; font-size: 14px; margin-bottom: 15px;">Выбери категорию:</p>
        <div class="grid" id="categories-grid">
            <button class="category-btn" onclick="selectCategory(this, 'Бильярд')"><i class="fa-solid fa-circle-dot icon"></i> Бильярд</button>
            <button class="category-btn" onclick="selectCategory(this, 'Бар')"><i class="fa-solid fa-beer-mug-empty icon"></i> Бар</button>
            <button class="category-btn" onclick="selectCategory(this, 'Кино')"><i class="fa-solid fa-film icon"></i> Кино</button>
            <button class="category-btn" onclick="selectCategory(this, 'Спорт')"><i class="fa-solid fa-futbol icon"></i> Спорт</button>
        </div>

        <div style="margin-top: 15px; text-align: left;">
            <p style="color: #888; font-size: 14px; margin-bottom: 5px;">Где и во сколько?</p>
            <input type="text" id="event-details" class="input-field" placeholder="Например: Галерея в 19:00">
            <p style="text-align: left; margin: 15px 0 5px 10px; color: #aaa; font-size: 14px;">Сколько человек ищем?</p>
            <input type="number" id="event-capacity" class="input-field" min="1" max="50" value="2">
        </div>
        
        <button class="main-btn" onclick="submitNewEvent()">Опубликовать встречу 🚀</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        let selectedCategory = "";
        const API_URL = "https://sandbag-lingo-python.ngrok-free.dev"; // Позже заменим на облачный адрес

        // Переключение между вкладками
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            if (tab === 'feed') {
                event.target.classList.add('active');
                document.getElementById('feed-screen').classList.add('active');
                loadEvents();
            } else {
                event.target.classList.add('active');
                document.getElementById('create-screen').classList.add('active');
            }
        }

        function selectCategory(btn, cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCategory = cat;
        }

      async function loadEvents() {
            try {
                let response = await fetch(`${API_URL}/api/events`);
                let events = await response.json();
                
                let container = document.getElementById('events-container');
                container.innerHTML = '';
                
                if (events.length === 0) {
                    container.innerHTML = '<p style="color: #777;">Пока нет активных встреч. Создай первую!</p>';
                    return;
                }

                events.forEach(ev => {
                    // Считаем сколько людей уже откликнулось
                    let currentCount = ev.participants ? ev.participants.length : 0;
                    let maxCount = ev.max_participants || 2; 
                    let slotsLeft = maxCount - currentCount;
                    
                    // Решаем, какую кнопку показать (активную или серую)
                    let buttonHtml = '';
                    if (slotsLeft > 0) {
                        buttonHtml = `<button onclick="respondToEvent('${ev.id}')" style="margin-top: 10px; width: 100%; padding: 10px; background: #ff5500; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Откликнуться</button>`;
                    } else {
                        buttonHtml = `<button disabled style="margin-top: 10px; width: 100%; padding: 10px; background: #555; color: #aaa; border: none; border-radius: 8px; font-weight: bold;">Мест нет</button>`;
                    }

                    container.innerHTML += `
                        <div class="event-card" style="background: #222; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left;">
                            <h3 style="margin-top: 0; color: #fff;">🎯 ${ev.category}</h3>
                            <p style="color: #ccc;">📍 <b>Где/Когда:</b> ${ev.details}</p>
                            <p style="color: #ccc;">👤 <b>Автор:</b> ${ev.creator_name}</p>
                            <p style="color: #ffaa00;">👥 <b>Осталось мест:</b> ${slotsLeft} из ${maxCount}</p>
                            ${buttonHtml}
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Ошибка загрузки ленты:", err);
            }
        }

        // Новая функция для обработки отклика
        async function respondToEvent(eventId) {
            let user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Владислав" };

            try {
                let response = await fetch(`${API_URL}/api/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: eventId,
                        user_id: user.id,
                        user_name: user.first_name
                    })
                });

                if (response.ok) {
                    alert("Ты успешно откликнулся на встречу! 🎉");
                    loadEvents(); // Сразу обновляем ленту, чтобы счетчик мест уменьшился
                } else {
                    let errData = await response.json();
                    alert("Ошибка: " + (errData.detail || response.status));
                }
            } catch (err) {
                alert("Ошибка сети: " + err.message);
            }
        }

      async function submitNewEvent() {
            let detailsInput = document.getElementById('event-details');
            let details = detailsInput.value;
            
            // Захватываем число из нового поля, которое ты только что добавил
            let capacityInput = document.getElementById('event-capacity');
            let capacity = parseInt(capacityInput.value) || 2; 
            
            if (typeof selectedCategory === 'undefined' || !selectedCategory || !details) {
                alert("Выбери категорию и укажи детали!");
                return;
            }

            let user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Владислав" };

            try {
                let response = await fetch(`${API_URL}/api/create-event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        creator_id: user.id,
                        creator_name: user.first_name,
                        category: selectedCategory,
                        details: details,
                        max_participants: capacity // <-- Отправляем количество мест на сервер!
                    })
                });

                if (response.ok) {
                    alert("Встреча успешно создана! 🚀");
                    detailsInput.value = '';
                    if(capacityInput) capacityInput.value = '2'; // Сбрасываем счетчик обратно
                    switchTab('feed');
                    loadEvents(); 
                } else {
                    alert("Ошибка сервера: " + response.status);
                }
            } catch (err) {
                alert("Ошибка сети: " + err.message);
            }
        }
        // Загружаем ленту при открытии
        loadEvents();
    </script>
</body>
</html>
